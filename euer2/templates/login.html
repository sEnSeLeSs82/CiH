<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – EüR</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #111318;
  --card:   #1c1e26;
  --line:   #2a2d38;
  --accent: #a8e063;
  --red:    #f07070;
  --text:   #dde1f0;
  --muted:  #5a5e72;
  --mono:   'Courier New', monospace;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 2rem 1.75rem;
  width: 100%;
  max-width: 340px;
}
h1 {
  font-size: 1.4rem;
  color: var(--accent);
  margin-bottom: 0.25rem;
  letter-spacing: 0.04em;
}
.sub {
  font-size: 0.75rem;
  color: var(--muted);
  margin-bottom: 1.5rem;
}
label {
  display: block;
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 0.3rem;
}
input[type=password] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 1rem;
  padding: 0.6rem 0.75rem;
  outline: none;
  transition: border-color 0.15s;
  margin-bottom: 1rem;
}
input[type=password]:focus { border-color: var(--accent); }
button {
  width: 100%;
  padding: 0.65rem;
  border-radius: 7px;
  border: none;
  background: var(--accent);
  color: #111;
  font-family: var(--mono);
  font-size: 0.95rem;
  font-weight: bold;
  cursor: pointer;
  transition: filter 0.15s;
}
button:hover { filter: brightness(1.1); }
.fehler {
  font-size: 0.8rem;
  color: var(--red);
  margin-bottom: 0.75rem;
}
</style>
</head>
<body>
<div class="box">
  <h1>EüR.db</h1>
  <p class="sub">Bitte Passwort eingeben</p>
  {% if fehler %}
  <div class="fehler">{{ fehler }}</div>
  {% endif %}
  <form method="post" action="/login">
    <label>Passwort</label>
    <input type="password" name="passwort" autofocus autocomplete="current-password">
    <button type="submit">Einloggen →</button>
  </form>
</div>
</body>
</html>
