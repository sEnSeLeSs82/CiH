# Datei nach /etc/nginx/sites-available/euer kopieren
# Dann aktivieren mit:
#   sudo ln -s /etc/nginx/sites-available/euer /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name euer.DEINEDOMAIN.de;
    # HTTP → HTTPS weiterleiten
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name euer.DEINEDOMAIN.de;

    # Vorhandenes Zertifikat eintragen:
    ssl_certificate     /etc/letsencrypt/live/DEINEDOMAIN.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DEINEDOMAIN.de/privkey.pem;

    # Weiterleitung an den Docker-Container
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
